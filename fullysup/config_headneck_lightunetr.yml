is_abdomenct1k: False
is_headneck: True

headneck:
  data_root: /data_hdd/xyliu/HNTSMRG24_train
  trainer:
    num_epochs: 1000
    warmup: 5
    train_ratio: 0.8
    batch_size: 16
    lr: 0.001
    min_lr: 0.0000001
    optimizer: adamw
    weight_decay: 0.005
    weight_decay_end: 0.04
    momentum_teacher: 0.996
    pred_ratio_var: 0
    num_workers: 8
    val_interval: 10
    gradient_accumulation_steps: 1
    
    image_size: 96
    resume: False

  finetune:
    checkpoint: headneck
  